function routeGameAction(action,el){

 else if(action==='route-close')routeMatch=null;

 else if(routeMatch&&action==='route-pick'&&!routeMatch.feedback){
   const round=routeQuestions[routeMatch.index],correct=round.chapter===el.dataset.id;

}

le="padding:12px 0;border-bottom:1px solid #315164"><summary><b>'+esc(st.find(x=>x.id===a.student_id)?.first_name||'Leerling')+'</b> · '+esc(a.topic)+' · '+esc(a.question_id)+'</summary><p style="white-space:pre-wrap;color:#d8e9f0">'+esc(a.response)+'</p></details>').join(''):'<p class="muted">Nog geen open antwoorden.</p>')+'</div><div class="section"><h2>Klas aanmelden</h2></div><div class="card pad"><p>Klascode: <strong style="font-size:25px;letter-spacing:3px;color:var(--mint)">'+esc(cl?.join_code||'')+'</strong></p><p class="small muted">Deel deze code alleen met je klas. Leerlingen gebruiken daarnaast een persoonlijke herstelcode voor hun eigen profiel.</p></div><button class="btn secondary" data-action="home" style="margin-top:20px">Terug naar game</button>';};
function paint(){applyV3();if(globeCleanup){globeCleanup();globeCleanup=null;}const teacher=state.view==='teacher';$('#app').innerHTML='<div class="wrap">'+head()+(teacher?teacherView():!state.student?'<div class="screen card pad"><h1>Welkom, ontdekkingsreiziger!</h1><p class="muted">Maak je profiel aan met je voornaam en de klascode van je docent.</p><form id="joinForm"><label>Jouw voornaam</label><input class="input" type="text" name="name" minlength="2" maxlength="32" required autocomplete="given-name" placeholder="Bijvoorbeeld Sam"><label>Klascode</label><input class="input" name="code" required minlength="6" placeholder="Vraag deze aan je docent"><button class="btn">🎮 Start mijn avontuur</button></form><hr style="border-color:#25485a;margin:24px 0"><p class="small muted">Heb je al een profiel op een ander apparaat?</p><button class="btn secondary" data-action="recover">Gebruik mijn herstelcode</button></div>':state.view==='home'?home():state.view==='chapter'?chapterView():state.view==='question'?questionView():state.view==='bossResult'?bossResult():state.view==='store'?store():state.view==='studio'?avatarView():state.view==='pass'?passView():home())+(state.student&&state.view==='question'&&state.result?bonusButton():'')+bonusModal()+routeGame()+v3Nav()+'<footer>GFR • Maris College Bohemen · Gemaakt om te leren, niet alleen te winnen. <br>Open vragen krijgen voorlopig een voorbeeldantwoord en geen automatische puntenscore.</footer></div>';bind();if(state.student&&state.view==='home'&&window.mountQuestGlobe){globeCleanup=window.mountQuestGlobe(id=>{state.chapter=id;state.view='chapter';paint();window.scrollTo(0,0);},avatars[state.student.avatar]||'🧑‍🚀');}}
function notify(message){alert(message)}
async function refresh(){if(!state.token)return;const [me,qs]=await Promise.all([call('me',{token:state.token}),call('questions',{token:state.token})]);state.student=me.student;state.attempts=me.attempts;state.purchases=me.purchases;state.questions=qs.questions;}
function showQ(q){state.current=q;state.chapter=q.chapter;state.chosen=null;state.result=null;state.lastAnswer=null;state.view='question';paint();window.scrollTo(0,0);}
async function teacherLoad(){state.teacher=sessionStorage.getItem('gfrq_teacher_token');if(state.teacher){try{state.teacherData=await call('teacher');}catch{state.teacher=null;state.teacherData=null;sessionStorage.removeItem('gfrq_teacher_token');}}state.view='teacher';paint();}
async function action(a,el){try{
 if(a==='studio-v3'||a==='pass-v3'){state.view=a==='studio-v3'?'studio':'pass';paint();window.scrollTo(0,0);return;}
 if(a==='equip-v3'||a==='bg-v3'||a==='color-v3'){
   const id=el.dataset.id,p=profileV3();
   if(a==='color-v3'&&Object.hasOwn(colors,id))await saveV3({color:id});
   if(a==='bg-v3'&&(!id||state.purchases.includes(id)))await saveV3({bg:id});
   if(a==='equip-v3'&&state.purchases.includes(id)&&items[id]){
     const gear=(p.gear||[]).filter(x=>items[x]?.[3]!==items[id][3]);
     if(!(p.gear||[]).includes(id))gear.push(id);
     await saveV3({gear});
   }
   paint();return;
 }
 if(a.startsWith('bonus-')){await bonusAction(a,el);return;}
 if(a==='theme'){window.questTheme(true);return;}
 if(a.startsWith('route-')){routeGameAction(a,el);return;}
if(a==='home'){state.view='home';paint();window.scrollTo(0,0)}
if(a==='chapter'){state.boss=null;state.chapter=el.dataset.ch||state.chapter;state.zone=0;state.view='chapter';paint()}
if(a==='zone'){state.zone=Math.max(0,Math.min(2,Number(el.dataset.zone)||0));state.view='chapter';paint()}
if(a==='question'){showQ(state.questions.find(x=>x.id===el.dataset.id))}
if(a==='choose'){state.chosen=el.dataset.val;paint()}
if(a==='submit'){const response=state.current.type==='choice'?state.chosen:$('#openResponse')?.value?.trim();if(response===null||response===undefined||response==='')return notify('Vul eerst een antwoord in.');state.lastAnswer=state.current.type==='open'?response:null;state.result=await call('answer',{token:state.token,questionId:state.current.id,response});if(state.boss){if(state.result.correct)state.boss.correct++;if(state.result.selfCheck)state.boss.open++;}await refresh();if(state.result.correct&&state.result.awarded&&bonusReady()&&uniqueGood().length%3===0)bonusRound(0);paint()}
if(a==='next'){if(state.boss){state.boss.index++;if(state.boss.index>=state.boss.ids.length){state.view='bossResult';paint();return;}showQ(state.questions.find(q=>q.id===state.boss.ids[state.boss.index]));return;}const qs=state.questions.filter(q=>q.chapter===state.chapter);const next=qs.find(q=>q.type!==state.current?.type&&!tried(q)&&q.id!==state.current?.id)||qs.find(q=>!tried(q)&&q.id!==state.current?.id)||qs.find(q=>q.type==='choice'&&!count(q)&&q.id!==state.current?.id);if(next)showQ(next);else{state.view='chapter';paint();notify('Goed gewerkt! Je hebt de beschikbare missies doorlopen. Herhaal vragen voor extra oefening.')}}
if(a==='store'){state.view='store';paint();window.scrollTo(0,0)}
if(a==='avatar'){await call('avatar',{token:state.token,avatar:el.dataset.avatar});await refresh();paint()}
if(a==='buy'){await call('buy',{token:state.token,item:el.dataset.id});await refresh();paint()}
if(a==='daily'||a==='repeat'){const pool=state.questions.filter(q=>q.chapter===state.chapter);const q=a==='repeat'?pool.find(x=>tried(x)&&!count(x))||pool.find(x=>tried(x)):pool.find(x=>tried(x)&&!count(x))||pool.find(x=>!tried(x));if(q)showQ(q);else notify('Je hebt deze vragen nog niet gemaakt. Start eerst een missie op het pad.')}
if(a==='boss'){const pool=state.questions.filter(q=>q.chapter===state.chapter);const pick=[...pool.filter(q=>q.type==='choice').sort(()=>Math.random()-.5).slice(0,2),...pool.filter(q=>q.type==='open').sort(()=>Math.random()-.5).slice(0,3)];state.boss={ids:pick.map(q=>q.id),index:0,correct:0,open:0};showQ(pick[0])}
if(a==='teacher'){await teacherLoad()}
if(a==='refreshTeacher'){await teacherLoad()}
if(a==='code'){if(!state.token)return notify('Je bent nog niet aangemeld.');try{await navigator.clipboard.writeText(state.token);notify('Je persoonlijke herstelcode is gekopieerd. Bewaar hem privé.')}catch{notify('Jouw herstelcode: '+state.token+' — bewaar hem privé.')}}
if(a==='recover'){const token=prompt('Vul je persoonlijke herstelcode in:');if(token){const old=state.token;state.token=token.trim();try{await refresh();localStorage.setItem('gfrq_token',state.token);state.view='home';paint()}catch(e){state.token=old;notify('Ongeldige herstelcode.')}}}
}catch(e){notify(e.message)}}
function bind(){window.questTheme(false);document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el)));
$('#joinForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await call('join',{name:f.get('name'),code:f.get('code')});state.token=r.token;localStorage.setItem('gfrq_token',r.token);await refresh();state.view='home';paint();alert('Welkom! Bewaar je persoonlijke herstelcode op een veilige plek: '+r.token+'\n\nMet deze code kun je later op een ander apparaat verder. Deel hem met niemand.')}catch(err){notify(err.message)}});
$('#teacherForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const res=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':publicKey},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const data=await res.json();if(!res.ok||!data.access_token)throw Error(data.error_description||data.msg||'Inloggen mislukt');state.teacher=data.access_token;state.teacherData=await call('teacher');sessionStorage.setItem('gfrq_teacher_token',state.teacher);paint()}catch(err){state.teacher=null;state.teacherData=null;notify(err.message)}});}
paint();if(state.token){refresh().then(()=>paint()).catch(()=>{state.student=null;state.token=null;localStorage.removeItem('gfrq_token');paint()})}
setInterval(()=>{if(state.student&&document.visibilityState==='visible'&&state.view!=='teacher'){call('heartbeat',{token:state.token}).catch(()=>{})}},30000);
</script></body></html>
