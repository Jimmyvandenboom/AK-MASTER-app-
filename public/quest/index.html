async function bonusAction(a,el){
 if(a==='bonus-close'){bonus=null;paint();return}
 if(!bonusReady())return;
 if(a==='bonus-start'||a==='bonus-river'){
  const game=a==='bonus-start'?'memory':'river';
  const run=await call('game-start',{token:state.token,game});
  bonus={...run,game,round:0,answers:[]};
  if(game==='memory')bonusRound(0);
 }
 else if(!bonus||bonus.won)return;
 else if(a==='bonus-hide'){bonus.show=false;bonus.pos=0}
 else {
  const selection=Number(el.dataset.val);
  let roundWon=false;
  if(a==='bonus-route-pick'){
   roundWon=selection===[0,1,0][bonus.round];
   bonus.missed=!roundWon;
  }else if(a==='bonus-pick'&&!bonus.show){
   if(selection!==bonus.seq[bonus.pos]){bonus.pos=0;bonus.picks=[];bonus.show=true}
   else {bonus.picks.push(selection);roundWon=++bonus.pos===bonus.seq.length;}
  }
  if(roundWon){
   bonus.answers[bonus.round]=bonus.game==='memory'?bonus.picks:selection;
   if(bonus.round===2){
    try{state.profile=(await call('game-badge',{token:state.token,game:bonus.game,rules:bonus.rules,signature:bonus.signature,answers:bonus.answers})).profile;}
    catch(error){bonus=null;paint();throw error;}
    bonus.won=true;
   }else if(bonus.game==='memory')bonusRound(bonus.round+1);
   else bonus.round++;
  }
 }
 paint();
}

 try{
  const {review}=await call('open-review',{token:state.token,questionId:question.id,response:lastAnswer});
  result.review=review;
  state.reviews[question.id]=review;
 }catch(error){
  result.reviewError=error.message;
 }finally{
  result.reviewPending=false;
  if(state.result===result&&state.view==='question')paint();
 }
 return;
}
if(a==='next' && state.examPaper){const next=state.questions.filter(q=>q.source && q.source.year+'-'+q.source.period===state.examPaper && q.source.number>state.current.source.number).sort((a,b)=>a.source.number-b.source.number)[0];if(next){showQ(next)}else{state.examPaper=null;state.view='examTrainer';paint()}return;}
if(a==='next'){if(state.boss){state.boss.index++;if(state.boss.index>=state.boss.ids.length){state.view='bossResult';paint();return;}showQ(state.questions.find(q=>q.id===state.boss.ids[state.boss.index]));return;}const qs=state.questions.filter(q=>q.chapter===state.chapter);const pool=qs.filter(q=>!!q.source===!!state.current?.source);const next=pool.find(q=>q.type!==state.current?.type&&!tried(q)&&q.id!==state.current?.id)||qs.find(q=>!tried(q)&&q.id!==state.current?.id)||qs.find(q=>q.type==='choice'&&!count(q)&&q.id!==state.current?.id);if(next)showQ(next);else{state.view='chapter';paint();notify('Goed gewerkt! Je hebt de beschikbare missies doorlopen. Herhaal vragen voor extra oefening.')}}
if(a==='store'){state.view='store';paint();window.scrollTo(0,0)}
if(a==='avatar'){await call('avatar',{token:state.token,avatar:el.dataset.avatar});await refresh();paint()}
if(a==='powerup-hint'){const result=await call('powerup',{token:state.token,questionId:state.current.id});state.profile=result.profile;state.hintRemoved=result.removedIndex;paint()}
if(a==='buy'){await call('buy',{token:state.token,item:el.dataset.id});await refresh();paint()}
if(a==='daily'||a==='repeat'){const pool=state.questions.filter(q=>q.chapter===state.chapter);const q=a==='repeat'?pool.find(x=>tried(x)&&!count(x))||pool.find(x=>tried(x)):pool.find(x=>x.type==='choice'&&tried(x)&&!count(x))||pool.find(x=>!tried(x));if(q)showQ(q);else notify(a==='repeat'?'Maak eerst een missie op het pad.':'Je hebt alle vragen in deze regio geoefend. Kies een andere regio of herhaal een missie.')}
if(a==='boss'){const pool=state.questions.filter(q=>q.chapter===state.chapter);const pick=[...pool.filter(q=>q.type==='choice').sort(()=>Math.random()-.5).slice(0,2),...pool.filter(q=>q.type==='open').sort(()=>Math.random()-.5).slice(0,3)];state.boss={ids:pick.map(q=>q.id),index:0,correct:0,open:0};showQ(pick[0])}
if(a==='teacher'){await teacherLoad()}
if(a==='teacherLogout'){sessionStorage.removeItem('gfrq_teacher_token');state.teacher=null;state.teacherData=null;state.teacherClassId=null;paint()}
if(a==='refreshTeacher'){await teacherLoad()}
if(a==='code'){if(!state.token)return notify('Je bent nog niet aangemeld.');try{await navigator.clipboard.writeText(state.token);notify('Je persoonlijke herstelcode is gekopieerd. Bewaar hem privé.')}catch{notify('Jouw herstelcode: '+state.token+' — bewaar hem privé.')}}
if(a==='recover'){const token=prompt('Vul je persoonlijke herstelcode in:');if(token){const old=state.token;state.token=token.trim();try{await refresh();localStorage.setItem('gfrq_token',state.token);state.view='home';paint()}catch(e){state.token=old;notify('Ongeldige herstelcode.')}}}
}catch(e){notify(e.message)}finally{if(mutating){action.pending=false;el.disabled=false;}}}
function bind(){window.questTheme(false);$('#teacher-class')?.addEventListener('change',event=>{state.teacherClassId=event.target.value;paint()});document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el)));
$('#joinForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await call('join',{name:f.get('name'),code:f.get('code')});state.token=r.token;localStorage.setItem('gfrq_token',r.token);await refresh();state.view='home';paint()}catch(err){notify(err.message)}});
$('#teacherForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const res=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':publicKey},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const data=await res.json();if(!res.ok||!data.access_token)throw Error(data.error_description||data.msg||'Inloggen mislukt');state.teacher=data.access_token;state.teacherData=await call('teacher');sessionStorage.setItem('gfrq_teacher_token',state.teacher);paint()}catch(err){state.teacher=null;state.teacherData=null;notify(err.message)}});}
paint();if(state.token){refresh().then(()=>paint()).catch(error=>{if(error.status===401){state.token=null;localStorage.removeItem('gfrq_token')}paint();if(error.status!==401)notify('Verbinding tijdelijk niet beschikbaar. Vernieuw de pagina om je voortgang opnieuw te laden.')})}
setInterval(()=>{if(state.student&&document.visibilityState==='visible'&&state.view!=='teacher'){call('heartbeat',{token:state.token}).catch(()=>{})}},30000);
</script></body></html>
