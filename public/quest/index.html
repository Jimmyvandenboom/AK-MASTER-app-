 return '<div class="row" style="margin-bottom:18px"><button class="btn ghost" data-action="home">← Terug naar de globe</button><span class="tag">WATER WARS / '+state.chapter+'</span></div><div style="margin:12px 0 24px"><div class="eyebrow">EXPEDITION LOG · '+state.chapter+'</div><h1>'+ch.title+'</h1><p class="muted">'+ch.sub+' — '+qs.length+' missies, inclusief '+qs.filter(q=>q.type==='open').length+' open vragen. Jouw avatar reist door het gebied.</p><div class="row"><span class="pill mint">✔ '+done(state.chapter)+' gesloten opdrachten goed</span><span class="pill">✍️ '+qs.filter(q=>q.type==='open'&&tried(q)).length+' open opdrachten gemaakt</span></div></div><div class="zone-switcher">'+['ACT 01 · Discover','ACT 02 · Explore','ACT 03 · Master'].map((label,i)=>'<button data-action="zone" data-zone="'+i+'" class="'+(i===zone?'on':'')+'">'+label+'</button>').join('')+'</div><div class="panel-grid"><div><div class="quest-map-shell '+(state.chapter==='H7'?'nl':state.chapter==='H8'?'cn':'me')+'">'+mapBackground(state.chapter)+'<div class="map-flag">'+ch.emoji+' · '+ch.title.toUpperCase()+' · ACT '+(zone+1)+'</div><div class="quest-map-checkpoints"><svg class="quest-map-line" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true"><path d="'+path+'" fill="none" stroke="#163648" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="'+path+'" fill="none" stroke="#f9e4aa" stroke-width="13" stroke-dasharray="22 14" stroke-linecap="round" stroke-linejoin="round"/></svg>'+stage.map((q,i)=>{const p=positions[i],complete=count(q),answered=tried(q);return '<div class="map-point" style="left:'+p[0]+'%;top:'+p[1]+'%">'+(q.id===first?.id?'<span class="player-pin">'+avatar()+'</span>':'')+'<button class="'+(complete?'complete':answered?'answered':q.id===first?.id?'current':'')+'" data-action="question" data-id="'+q.id+'" title="'+esc(q.text)+'">'+(complete?'✓':answered?'↻':q.type==='open'?'✍️':i%3===0?'🧠':i%3===1?'🗺️':'💧')+'</button><span class="map-label">'+(zone*8+i+1)+'. '+(q.type==='open'?'Verklaar!':q.skill==='toepassen'?'Bronnenmissie':'Kennismissie')+'</span></div>'}).join('')+'</div><div class="map-flag bottom">◈ TAP CHECKPOINTS · LEER · ONTGRENDEL</div></div><div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn secondary" data-action="zone" data-zone="'+Math.max(0,zone-1)+'" '+(zone===0?'disabled':'')+'>← Vorige gebied</button><button class="btn secondary" data-action="zone" data-zone="'+Math.min(2,zone+1)+'" '+(zone===2?'disabled':'')+'>Volgende gebied →</button></div><div class="card pad" style="margin-top:18px"><div class="eyebrow">🏆 THE CHAPTER BOSS</div><h3>Durf jij het aan?</h3><p class="muted small">5 lastige vragen: 3 open verklaringsvragen en 2 gesloten vragen. Bespreek je antwoorden met de voorbeeldoplossingen.</p><button class="btn" data-action="boss">Start de eindbaas →</button></div></div><aside class="map-side"><div class="card sidecard"><h3>🧠 Smart Training</h3><p class="muted small">Pak je eerdere fouten aan en haal kennis actief op uit je geheugen.</p><button class="btn secondary" data-action="daily">Start kennisboost</button></div><div class="card sidecard"><h3>🎬 Video Coach</h3><p class="muted small">Kijk een korte uitleg wanneer je vastloopt. Probeer daarna weer een vraag.</p>'+ch.video.map(v=>'<a class="video" target="_blank" rel="noopener" href="'+v[1]+'">▶ '+esc(v[0])+' ↗</a>').join('')+'</div><div class="card sidecard"><h3>💎 Memory Quest</h3><p class="muted small">Haal kennis terug die je eerder geoefend hebt.</p><button class="btn secondary" data-action="repeat">Herhaal een vraag</button></div><div class="card sidecard"><h3>🎒 Beloning</h3><p class="muted small">Geo Coins en avatarupgrades zijn cosmetisch. Je leerresultaat telt!</p><button class="btn secondary" data-action="store">Open Geo Shop</button></div></aside></div>';};
const questionView=()=>{const q=state.current;if(!q)return '';const has=!!state.result;return '<div class="screen"><div class="row" style="justify-content:space-between;margin-bottom:20px"><button class="btn ghost" data-action="chapter" data-ch="'+state.chapter+'">← Terug naar pad</button><span class="pill">'+q.chapter+' • '+(q.type==='open'?'Open examenvraag':q.skill)+'</span></div><div class="card qbox"><div class="eyebrow">'+(state.boss?'🏆 BOSS BATTLE · '+(state.boss.index+1)+' / '+state.boss.ids.length+' · ':'')+(q.type==='open'?'✍️ GEOGRAFISCH VERKLAREN':'🧠 KENNIS & TOEPASSEN')+'</div><h2 class="question">'+esc(q.text)+'</h2>'+(q.type==='choice'?q.options.map((o,i)=>'<button class="option '+(state.chosen===String(i)?'selected':'')+'" data-action="choose" data-val="'+i+'" '+(has?'disabled':'')+'><span class="letter">'+('ABCD'[i])+'</span>'+esc(o)+'</button>').join(''):'<textarea class="answer" id="openResponse" placeholder="Schrijf je uitleg in eigen woorden. Probeer oorzaak en gevolg te benoemen." '+(has?'disabled':'')+'></textarea>')+(has?'<div class="feedback '+(state.result.correct===false?'bad':'')+'"><b>'+(state.result.selfCheck?'Voorbeeldantwoord • zelf nakijken':state.result.correct?'Goed! +'+state.result.awarded+' XP':'Nog niet goed — dit leer je ervan')+'</b><p>'+esc(state.result.explanation)+'</p>'+(state.result.selfCheck?'<p class="subline">Deze open oefenvraag is opgeslagen maar niet automatisch beoordeeld. Vergelijk je antwoord met het voorbeeld. Hieraan worden geen examendeelpunten toegekend.</p>':'')+'</div><div class="row" style="margin-top:22px"><button class="btn" data-action="next">Volgende missie →</button><button class="btn secondary" data-action="chapter" data-ch="'+state.chapter+'">Terug naar kaart</button></div>':'<div class="row" style="margin-top:24px"><button class="btn" data-action="submit">Controleer antwoord →</button><span class="muted small">Geen tijdslimiet • Denk eerst zelf na</span></div>')+'</div></div>';};
const bossResult=()=>'<div class="screen card pad" style="text-align:center"><div style="font-size:100px">🏆</div><h1>Chapter Boss voltooid!</h1><p class="muted">Je hebt '+(state.boss?.ids.length||5)+' vragen gemaakt, waaronder '+(state.boss?.open||0)+' open verklaringsvragen. Gesloten vragen goed: '+(state.boss?.correct||0)+'. Vergelijk je open antwoorden kritisch met het voorbeeld. Dit is geen officiële examenuitslag.</p><button class="btn" data-action="chapter" data-ch="'+state.chapter+'">Terug naar de expeditie →</button></div>';const store=()=>'<div class="screen"><div class="row" style="margin-bottom:18px"><button class="btn ghost" data-action="home">← Terug</button><span class="pill gold">🪙 '+state.student.coins+' coins</span></div><div class="card pad"><div class="eyebrow">Avatar & uitrusting</div><h1>Geo Shop</h1><p class="muted">Verdien coins met goed gemaakte oefenvragen. Upgrades zijn alleen cosmetisch.</p><div class="section"><h3>Jouw karakter</h3></div><div class="row">'+Object.entries(avatars).map(([key,emo])=>'<button class="orb '+(state.student.avatar===key?'done':'')+'" title="'+key+'" data-action="avatar" data-avatar="'+key+'">'+emo+'</button>').join('')+'</div><div class="section"><h3>Upgrades</h3></div><div class="store">'+Object.entries(items).map(([id,x])=>'<div class="storeitem"><div class="icon">'+x[0]+'</div><h3>'+x[1]+'</h3><p class="muted small">🪙 '+x[2]+'</p><button class="btn secondary" '+(state.purchases.includes(id)?'disabled':'')+' data-action="buy" data-id="'+id+'">'+(state.purchases.includes(id)?'Vrijgespeeld ✓':'Ontgrendel')+'</button></div>').join('')+'</div></div></div>';
const teacherView=()=>{const d=state.teacherData;if(!d)return '<div class="screen card pad"><h1>Docent Mission Control</h1><p class="muted">Log in met het bestaande docentaccount van de GFR-omgeving.</p><form id="teacherForm"><label>E-mailadres</label><input class="input" type="email" name="email" required autocomplete="username"><label>Wachtwoord</label><input class="input" type="password" name="password" required autocomplete="current-password"><button class="btn">Open docentendashboard</button></form><p class="small muted">Alleen accounts die geregistreerd zijn als docent krijgen toegang.</p><button class="btn ghost" data-action="home">Terug naar leerlingomgeving</button></div>';
const st=d.students,at=d.attempts,cl=d.classes[0],openResponses=at.filter(a=>a.is_correct===null).slice(0,20);const avg=st.length?Math.round(st.reduce((n,s)=>n+s.active_seconds,0)/st.length/60):0;
const tCount=(s,ch)=>new Set(at.filter(a=>a.student_id===s.id&&a.topic===ch&&a.is_correct).map(a=>a.question_id)).size;
const groups=['H7','H8','H9'].map(ch=>{const v=at.filter(a=>a.topic===ch&&a.is_correct!==null);return {ch,total:v.length,ok:v.filter(a=>a.is_correct).length};});
const weak=Object.entries(at.filter(a=>a.is_correct!==null).reduce((ob,a)=>{const k=a.topic+' / '+a.skill;const x=ob[k]||(ob[k]={total:0,bad:0});x.total++;if(!a.is_correct)x.bad++;return ob;},{})).filter(([k,v])=>v.total>=3).sort((a,b)=>b[1].bad/b[1].total-a[1].bad/a[1].total).slice(0,6);
return '<div class="row" style="justify-content:space-between;margin-bottom:18px"><h1>Mission Control</h1><button class="btn secondary" data-action="refreshTeacher">↻ Ververs</button></div><p class="muted">4TL • Water Wars • tussentijdse klasresultaten</p><div class="stats"><div class="stat"><strong>'+st.length+'</strong><span>Leerlingen aangemeld</span></div><div class="stat"><strong>'+at.length+'</strong><span>Antwoorden opgeslagen</span></div><div class="stat"><strong>'+avg+' min</strong><span>Gemiddeld actieve oefentijd</span></div></div><div class="section"><h2>Klasoverzicht</h2></div><div class="card pad table-scroll"><table class="teacher-table"><thead><tr><th>Voornaam</th><th>H7</th><th>H8</th><th>H9</th><th>XP</th><th>Actieve tijd</th><th>Laatst actief</th></tr></thead><tbody>'+st.map(s=>'<tr><td><b>'+esc(s.first_name)+'</b></td>'+['H7','H8','H9'].map(ch=>'<td>'+tCount(s,ch)+'/10</td>').join('')+'<td>'+s.xp+'</td><td>'+Math.floor(s.active_seconds/60)+' min</td><td>'+new Date(s.last_seen).toLocaleString('nl-NL')+'</td></tr>').join('')+'</tbody></table></div><div class="section"><h2>Waar aandacht aan besteden?</h2></div><div class="grid3">'+groups.map(x=>'<div class="card pad"><h3>'+x.ch+'</h3><p class="muted">Antwoorden: '+x.total+'</p><h2 style="color:var(--mint)">'+(x.total?Math.round(x.ok/x.total*100)+'%':'—')+'</h2><p class="small muted">Percentage goed op gemaakte gesloten vragen, geen SE-cijfer.</p></div>').join('')+'</div><div class="section"><h2>Veelgemaakte fouten</h2></div><div class="card pad">'+(weak.length?weak.map(([k,v])=>'<p><b>'+esc(k)+'</b> — '+v.bad+' van '+v.total+' antwoorden fout ('+Math.round(v.bad/v.total*100)+'%)</p>').join(''):'<p class="muted">Nog te weinig gegevens voor een betrouwbaar advies.</p>')+'</div><div class="section"><h2>Open antwoorden · bespreek samen</h2></div><div class="card pad"><p class="muted small">Open antwoorden zijn nog niet automatisch beoordeeld.</p>'+(openResponses.length?openResponses.map(a=>'<details style="padding:12px 0;border-bottom:1px solid #315164"><summary><b>'+esc(st.find(x=>x.id===a.student_id)?.first_name||'Leerling')+'</b> · '+esc(a.topic)+' · '+esc(a.question_id)+'</summary><p style="white-space:pre-wrap;color:#d8e9f0">'+esc(a.response)+'</p></details>').join(''):'<p class="muted">Nog geen open antwoorden.</p>')+'</div><div class="section"><h2>Klas aanmelden</h2></div><div class="card pad"><p>Klascode: <strong style="font-size:25px;letter-spacing:3px;color:var(--mint)">'+esc(cl?.join_code||'')+'</strong></p><p class="small muted">Deel deze code alleen met je klas. Leerlingen gebruiken daarnaast een persoonlijke herstelcode voor hun eigen profiel.</p></div><button class="btn secondary" data-action="home" style="margin-top:20px">Terug naar game</button>';};
function paint(){if(globeCleanup){globeCleanup();globeCleanup=null;}const teacher=state.view==='teacher';$('#app').innerHTML='<div class="wrap">'+head()+(teacher?teacherView():!state.student?'<div class="screen card pad"><h1>Welkom, ontdekkingsreiziger!</h1><p class="muted">Maak je profiel aan met je voornaam en de klascode van je docent.</p><form id="joinForm"><label>Jouw voornaam</label><input class="input" type="text" name="name" minlength="2" maxlength="32" required autocomplete="given-name" placeholder="Bijvoorbeeld Sam"><label>Klascode</label><input class="input" name="code" required minlength="6" placeholder="Vraag deze aan je docent"><button class="btn">🎮 Start mijn avontuur</button></form><hr style="border-color:#25485a;margin:24px 0"><p class="small muted">Heb je al een profiel op een ander apparaat?</p><button class="btn secondary" data-action="recover">Gebruik mijn herstelcode</button></div>':state.view==='home'?home():state.view==='chapter'?chapterView():state.view==='question'?questionView():state.view==='bossResult'?bossResult():state.view==='store'?store():home())+'<footer>GFR • Maris College Bohemen · Gemaakt om te leren, niet alleen te winnen. <br>Open vragen krijgen voorlopig een voorbeeldantwoord en geen automatische puntenscore.</footer></div>';bind();if(state.student&&state.view==='home'&&window.mountQuestGlobe){globeCleanup=window.mountQuestGlobe(id=>{state.chapter=id;state.view='chapter';paint();window.scrollTo(0,0);},avatars[state.student.avatar]||'🧑‍🚀');}}
function notify(message){alert(message)}
async function refresh(){if(!state.token)return;const [me,qs]=await Promise.all([call('me',{token:state.token}),call('questions',{token:state.token})]);state.student=me.student;state.attempts=me.attempts;state.purchases=me.purchases;state.questions=qs.questions;}
function showQ(q){state.current=q;state.chapter=q.chapter;state.chosen=null;state.result=null;state.view='question';paint();window.scrollTo(0,0);}
async function teacherLoad(){state.teacher=sessionStorage.getItem('gfrq_teacher_token');if(state.teacher){try{state.teacherData=await call('teacher');}catch{state.teacher=null;state.teacherData=null;sessionStorage.removeItem('gfrq_teacher_token');}}state.view='teacher';paint();}
async function action(a,el){try{
if(a==='home'){state.view='home';paint()}
if(a==='chapter'){state.boss=null;state.chapter=el.dataset.ch||state.chapter;state.zone=0;state.view='chapter';paint()}
if(a==='zone'){state.zone=Math.max(0,Math.min(2,Number(el.dataset.zone)||0));state.view='chapter';paint()}
if(a==='question'){showQ(state.questions.find(x=>x.id===el.dataset.id))}
if(a==='choose'){state.chosen=el.dataset.val;paint()}
if(a==='submit'){const response=state.current.type==='choice'?state.chosen:$('#openResponse')?.value?.trim();if(response===null||response===undefined||response==='')return notify('Vul eerst een antwoord in.');state.result=await call('answer',{token:state.token,questionId:state.current.id,response});if(state.boss){if(state.result.correct)state.boss.correct++;if(state.result.selfCheck)state.boss.open++;}await refresh();paint()}
if(a==='next'){if(state.boss){state.boss.index++;if(state.boss.index>=state.boss.ids.length){state.view='bossResult';paint();return;}showQ(state.questions.find(q=>q.id===state.boss.ids[state.boss.index]));return;}const qs=state.questions.filter(q=>q.chapter===state.chapter);const next=qs.find(q=>!tried(q)&&q.id!==state.current?.id)||qs.find(q=>!count(q)&&q.id!==state.current?.id);if(next)showQ(next);else{state.view='chapter';paint();notify('Goed gewerkt! Je hebt de beschikbare missies doorlopen. Herhaal vragen voor extra oefening.')}}
if(a==='store'){state.view='store';paint()}
if(a==='avatar'){await call('avatar',{token:state.token,avatar:el.dataset.avatar});await refresh();paint()}
if(a==='buy'){await call('buy',{token:state.token,item:el.dataset.id});await refresh();paint()}
if(a==='daily'||a==='repeat'){const pool=state.questions.filter(q=>q.chapter===state.chapter);const q=a==='repeat'?pool.find(x=>tried(x)&&!count(x))||pool.find(x=>tried(x)):pool.find(x=>tried(x)&&!count(x))||pool.find(x=>!tried(x));if(q)showQ(q);else notify('Je hebt deze vragen nog niet gemaakt. Start eerst een missie op het pad.')}
if(a==='boss'){const pool=state.questions.filter(q=>q.chapter===state.chapter);const pick=[...pool.filter(q=>q.type==='choice').sort(()=>Math.random()-.5).slice(0,2),...pool.filter(q=>q.type==='open').sort(()=>Math.random()-.5).slice(0,3)];state.boss={ids:pick.map(q=>q.id),index:0,correct:0,open:0};showQ(pick[0])}
if(a==='teacher'){await teacherLoad()}
if(a==='refreshTeacher'){await teacherLoad()}
if(a==='code'){if(!state.token)return notify('Je bent nog niet aangemeld.');try{await navigator.clipboard.writeText(state.token);notify('Je persoonlijke herstelcode is gekopieerd. Bewaar hem privé.')}catch{notify('Jouw herstelcode: '+state.token+' — bewaar hem privé.')}}
if(a==='recover'){const token=prompt('Vul je persoonlijke herstelcode in:');if(token){const old=state.token;state.token=token.trim();try{await refresh();localStorage.setItem('gfrq_token',state.token);state.view='home';paint()}catch(e){state.token=old;notify('Ongeldige herstelcode.')}}}
}catch(e){notify(e.message)}}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el)));
$('#joinForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await call('join',{name:f.get('name'),code:f.get('code')});state.token=r.token;localStorage.setItem('gfrq_token',r.token);await refresh();state.view='home';paint();alert('Welkom! Bewaar je persoonlijke herstelcode op een veilige plek: '+r.token+'\n\nMet deze code kun je later op een ander apparaat verder. Deel hem met niemand.')}catch(err){notify(err.message)}});
$('#teacherForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const res=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':publicKey},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const data=await res.json();if(!res.ok||!data.access_token)throw Error(data.error_description||data.msg||'Inloggen mislukt');state.teacher=data.access_token;state.teacherData=await call('teacher');sessionStorage.setItem('gfrq_teacher_token',state.teacher);paint()}catch(err){state.teacher=null;state.teacherData=null;notify(err.message)}});}
paint();if(state.token){refresh().then(()=>paint()).catch(()=>{state.student=null;state.token=null;localStorage.removeItem('gfrq_token');paint()})}
setInterval(()=>{if(state.student&&document.visibilityState==='visible'&&state.view!=='teacher'){call('heartbeat',{token:state.token}).catch(()=>{})}},30000);
</script></body></html>
